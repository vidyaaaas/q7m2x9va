name: Verify pilot
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_snapshot.py
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: docker build -t windward .
      - run: |
          docker run -d -p 8000:8000 --name windward windward
          for i in $(seq 1 20); do curl --fail http://localhost:8000/api/health && exit 0; sleep 2; done
          docker logs windward
          exit 1
